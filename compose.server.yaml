services:
  api:
    # Host Nginx terminates HTTPS on public port 8000.
    ports: !override
      - "127.0.0.1:8001:8000"

  hindsight:
    environment:
      HF_HUB_OFFLINE: "1"

  # Knowledge-base embeddings without the remote relay.
  #
  # It reuses the hindsight image on purpose: that image already ships
  # torch, transformers and sentence-transformers in /app/api/.venv, so the
  # sidecar pulls nothing and the two services run the identical library
  # stack. Weights come from the cache volume hindsight already filled.
  # server.py loads the model lazily, so an unused service costs ~50 MB.
  local-embeddings:
    image: ghcr.io/vectorize-io/hindsight-api:0.8.4@sha256:c4471d10ab96db4ba91b0d26fa1801d57f541fae08de5634a5e186478a2cfa86
    restart: unless-stopped
    entrypoint: ["/app/api/.venv/bin/python"]
    command: ["/app/server.py"]
    environment:
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_MODEL_PATH: /models/hub/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - hindsight_model_cache:/models
      - ./infra/local-embeddings/server.py:/app/server.py:ro
    expose:
      - "8080"
    mem_limit: 4g

volumes:
  hindsight_model_cache:
    external: true
    name: antang-prod_hindsight_model_cache
